<!doctype html>
<html lang="ru" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Title{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/bootstrap.min.css">
</head>
<body class="bg-2">
  <div class="container py-4">
    {% if user.is_authenticated %}
    <nav class="navbar bg-white border rounded-3 shadow-sm mb-4 px-3">
      <div class="d-flex gap-3">
        <a class="nav-link{% if request.resolver_match.url_name == 'index' %} active fw-semibold{% endif %}" href="{% url 'index' %}">Главная</a>
        <a class="nav-link{% if request.resolver_match.url_name == 'about' %} active fw-semibold{% endif %}" href="{% url 'about' %}">О проекте</a>
      </div>
      <form action="{% url 'logout' %}" method="post" class="ms-auto">
        {% csrf_token %}
        <button class="btn btn-outline theme-secondary" type="submit">Выйти</button>
      </form>
    </nav>
    {% endif %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
